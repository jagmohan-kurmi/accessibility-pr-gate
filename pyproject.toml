[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-pr-gate"
version = "0.1.0"
description = "A fast, local static accessibility gate for HTML files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
accessibility-pr-gate = "accessibility_pr_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
